server.port=8080

# ===============================
# Active Storage: MySQL Database
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/rapchieuphim?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# Nap cau hinh cuc bo neu co (da duoc .gitignore bao ve, khong lo thong tin len Git)
spring.config.import=optional:file:./application-local.properties,optional:file:../application-local.properties

# JPA / Hibernate Configuration for MySQL
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.auto_quote_keyword=true

# Disable H2 console when using MySQL
spring.h2.console.enabled=false

# JSON Date/Time formatting
spring.jackson.date-format=yyyy-MM-dd
spring.jackson.time-zone=Asia/Ho_Chi_Minh
spring.jackson.serialization.write-dates-as-timestamps=false
